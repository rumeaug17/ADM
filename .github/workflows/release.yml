name: Build, Attach Wheel and Push Container to Release

on:
  release:
    types: [published]
  workflow_dispatch: # Permet de relancer le workflow manuellement depuis l'interface GitHub

jobs:
  check-and-build:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Autorise l'ajout d'assets à la release GitHub
      packages: write  # Autorise le push de l'image vers GitHub Container Registry (GHCR)

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Récupère tous les tags et l'historique Git pour git describe

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies and tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install ruff mypy build

      - name: Run Ruff check
        run: ruff check .

      - name: Run Ruff format check
        run: ruff format --check .

      - name: Install project dependencies (tests, pip-audit)
        run: python -m pip install -e '.[dev]'

      # Tâche 3.10 du backlog : la release n'était jusqu'ici jamais bloquée par
      # un échec des tests ni par une régression de couverture. Le seuil
      # minimal (`fail_under`) est déclaré dans pyproject.toml
      # (`[tool.coverage.report]`), seule source de vérité partagée avec le job
      # `test` de la CI GitLab.
      - name: Run tests with coverage
        run: pytest --cov=ADM --cov-report=term-missing

      # Tâche 3.9 du backlog : analyse des vulnérabilités connues (base OSV) des
      # dépendances (dev extras, y compris pip-audit et pytest-cov, tous deux
      # déclarés dans pyproject.toml). Installées séparément pour ne pas changer
      # l'environnement des étapes ruff ci-dessus, qui tournaient jusqu'ici sans
      # les dépendances du projet installées.
      # `continue-on-error` rend le résultat de pip-audit visible sans bloquer
      # la publication de la release le temps de trier les éventuels
      # signalements ; à retirer une fois ce premier triage effectué.
      - name: Run pip-audit
        run: pip-audit
        continue-on-error: true

      - name: Write version file
        run: |
          mkdir -p src/ADM/resources/static
          git describe --tags --always > src/ADM/resources/static/version.txt

      - name: Build wheel package
        run: python -m build --wheel

      - name: Upload wheel to GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.event_name == 'release' && startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/*.whl

      # --- ÉTAPES DOCKER / CONTAINER REGISTRY ---

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          