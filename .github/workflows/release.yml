name: Build, Attach Wheel and Push Container to Release

on:
  release:
    types: [published]
  workflow_dispatch: # Permet de relancer le workflow manuellement depuis l'interface GitHub

jobs:
  check-and-build:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Autorise l'ajout d'assets à la release GitHub
      packages: write  # Autorise le push de l'image vers GitHub Container Registry (GHCR)

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Récupère tous les tags et l'historique Git pour git describe

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies and tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install ruff mypy build

      - name: Run Ruff check
        run: ruff check .

      - name: Run Ruff format check
        run: ruff format --check .

      - name: Write version file
        run: |
          mkdir -p src/ADM/resources/static
          git describe --tags --always > src/ADM/resources/static/version.txt

      - name: Build wheel package
        run: python -m build --wheel

      - name: Upload wheel to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.whl

      # --- ÉTAPES DOCKER / CONTAINER REGISTRY ---

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
