apiVersion: v1
kind: Secret
metadata:
  name: adm-secrets
  labels:
    app.kubernetes.io/name: adm
type: Opaque
stringData:
  # GABARIT — valeurs factices, à remplacer avant tout déploiement réel.
  #
  # Ne committez jamais ce fichier une fois complété : copiez-le d'abord vers
  # k8s/secret.yaml (ignoré par Git, voir .gitignore), puis éditez uniquement
  # cette copie. En Production, préférez l'injection par le gestionnaire de
  # secrets de votre organisation (External Secrets Operator, Sealed Secrets,
  # Vault, etc.) plutôt qu'un Secret Kubernetes en clair dans un dépôt, même
  # ignoré par Git. Voir docs/CODING_GUIDELINES.md et docs/CONTAINER.md.
  #
  # Clé longue et aléatoire signant les sessions Flask (INSTALL.md section 5) ;
  # la renouveler déconnecte tous les utilisateurs. Générer par exemple avec :
  #   python -c "import secrets; print(secrets.token_urlsafe(32))"
  ADM_SECRET_KEY: "cle-locale-factice-a-remplacer"
  # URL SQLAlchemy complète (caractères réservés du mot de passe encodés pour
  # une URL, voir INSTALL.md section 5) :
  #   mysql+mysqlconnector://<utilisateur>:<mot-de-passe-encode>@<hote>/<base>
  ADM_DATABASE_URL: "mysql+mysqlconnector://utilisateur:secret@mysql-host/adm"
