name: Build and Attach Wheel to Release

on:
  release:
    types: [published]

jobs:
  build-and-attach:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Autorise l'ajout d'assets à la release GitHub

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Récupère tous les tags et l'historique Git pour `git describe`

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tool
        run: |
          python -m pip install --upgrade pip
          python -m pip install build

      - name: Write version file
        run: |
          mkdir -p src/ADM/resources/static
          git describe --tags --always > src/ADM/resources/static/version.txt

      - name: Build wheel package
        run: python -m build --wheel

      - name: Upload wheel to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.whl
