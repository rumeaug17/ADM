{% extends "base.html" %}

{% block title %}ADM{% endblock %}

{% block content %}

<h2 class="text-center text-primary mb-4"><i class="bi bi-box-arrow-in-right" aria-hidden="true"></i> Connexion</h2>
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">
            {{ message }}
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
          </div>
        {% endfor %}
      {% endif %}
    {% endwith %}
    <div class="card p-4" style="max-width: 420px; margin: 0 auto;">
      <form method="post">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        <div class="form-floating mb-3">
          <input type="text" name="username" id="login-username" class="form-control" placeholder="Nom d'utilisateur" required>
          <label for="login-username">Nom d'utilisateur</label>
        </div>
        <div class="form-floating mb-3">
          <input type="password" name="password" id="login-password" class="form-control" placeholder="Mot de passe" required>
          <label for="login-password">Mot de passe</label>
        </div>
        <button type="submit" class="btn btn-primary w-100"><i class="bi bi-box-arrow-in-right" aria-hidden="true"></i> Se connecter</button>
      </form>
    </div>

{% endblock %}
