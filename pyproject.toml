[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "adm-catalogue"
version = "2.0.1"
description = "Catalogue d'applications et évaluation de leur dette technique"
authors = [
    { name = "Guillaume Rumeau" }
]
license = "MIT" 
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.13,<2",
    "Flask>=3.0,<4",
    "matplotlib>=3.8,<4",
    "mysql-connector-python>=8.3,<10",
    "numpy>=1.26,<2",
    "SQLAlchemy>=2.0,<3",
]

[project.urls]
Homepage = "https://github.com/rumeaug17/ADM"
Repository = "https://github.com/rumeaug17/ADM"

[project.optional-dependencies]
dev = [
    "build>=1.2,<2",
    "mypy>=1.10,<2",
    "pip-audit>=2.7,<3",
    "pytest>=8,<9",
    # Tâche 3.10 du backlog : mesure et suivi de la couverture de tests
    # (voir [tool.coverage.*] plus bas et le job `test` de .gitlab-ci.yml).
    "pytest-cov>=5,<8",
    "ruff>=0.6,<1",
]
# Serveur WSGI de production utilisé par l'image conteneurisée (Tâche 0.3 du
# backlog, voir Dockerfile et docs/CONTAINER.md). Volontairement absent de la
# liste `dependencies` : les installations traditionnelles (INSTALL.md) restent
# libres de leur propre serveur WSGI.
container = [
    "gunicorn>=22,<23",
]

[tool.setuptools]
script-files = [
    "scripts/backup_restore.py",
    "scripts/create_account.py",
    "scripts/generate_md_doc.py",
    "scripts/generate_data_json.py",
    "scripts/generate_data_mysql.py",
    "scripts/run_demo.ps1",
    "scripts/run_demo.sh",
    "scripts/setup_demo.ps1",
    "scripts/setup_demo.sh",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# "resources/static/**" (récursif) est nécessaire depuis la Phase 1 de US4.1
# (voir docs/UI_MODERNIZATION_PROPOSAL.md) : les assets statiques ne sont plus
# tous à plat dans resources/static/, on y trouve désormais des
# sous-répertoires (resources/static/css/, resources/static/vendor/...).
ADM = ["resources/config.json", "resources/static/**", "resources/templates/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

# Tâche 3.10 du backlog : la suite de tests était déjà large et bien
# structurée, mais aucun rapport de couverture n'était produit ni suivi dans
# le temps. `source` restreint la mesure au code applicatif (`ADM`), à
# l'exclusion des tests eux-mêmes. Le job `test` de la CI invoque
# `pytest --cov=ADM --cov-report=term-missing` ; les options ci-dessous
# s'appliquent alors automatiquement (single source of truth), sans changer
# le comportement d'un `pytest` exécuté sans `--cov`.
[tool.coverage.run]
source = ["ADM"]

[tool.coverage.report]
show_missing = true
# Seuil initial fixé au niveau de couverture mesuré au moment de
# l'introduction du contrôle (86 %), pour interdire toute régression future
# sans bloquer sur un objectif arbitraire non atteint aujourd'hui. À relever
# progressivement à mesure que la couverture s'améliore.
fail_under = 86

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "main.py"]
follow_imports = "skip"
