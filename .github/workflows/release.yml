name: Build and Attach Wheel to Release

on:
  release:
    types: [published]

jobs:
  check-and-build:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Autorise l'ajout d'assets à la release GitHub

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Récupère tous les tags et l'historique Git pour `git describe`

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies and tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install ruff mypy build
          # Si des dépendances du projet/stubs sont nécessaires pour MyPy, installe-les ici :
          # if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run Ruff check
        run: ruff check .

      - name: Run Ruff format check
        run: ruff format --check .

      - name: Run MyPy static type check
        run: mypy src/

      - name: Write version file
        run: |
          mkdir -p src/ADM/resources/static
          git describe --tags --always > src/ADM/resources/static/version.txt

      - name: Build wheel package
        run: python -m build --wheel

      - name: Upload wheel to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.whl
